spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://localhost:3306/erp_db
    username: erp_user
    password: erp_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/master.xml

jwt:
  secret: your-secret-key-change-this-in-production
  expiration: 3600000
  refresh-expiration: 86400000

server:
  port: 8081
  servlet:
    context-path: /api/v1

logging:
  level:
    root: INFO
    com.erp.commerce: DEBUG